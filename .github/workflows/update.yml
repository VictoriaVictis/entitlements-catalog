name: Update catalog

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: entitlements-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Cache state
        uses: actions/cache@v4
        with:
          path: state/steam
          key: steam-state-${{ github.run_id }}
          restore-keys: |
            steam-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run incremental update
        run: python scripts/update_catalog.py --storefront steam --mode incremental --concurrency 8
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - name: Check for catalog changes
        id: check_catalog
        run: |
          if [ -n "$(git status --porcelain catalogs/steam/v1/dlc.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.check_catalog.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: "catalogs/steam/v1/dlc.json state/steam/**"
          commit_message: "Update entitlements catalog"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
