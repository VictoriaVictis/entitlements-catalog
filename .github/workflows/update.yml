name: Discover unlisted Steam DLC

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      segments:
        description: "100,000-ID segments to scan (use 60 for initial backfill)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: entitlements-catalog
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build anonymous Steam product-info scanner
        run: dotnet build tools/PicsScanner/PicsScanner.csproj -c Release

      - name: Discover and checkpoint DLC
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          SEGMENTS: ${{ inputs.segments || '1' }}
        run: |
          if ! [[ "$SEGMENTS" =~ ^[0-9]+$ ]] || (( SEGMENTS < 1 || SEGMENTS > 60 )); then
            echo "segments must be 1..60" >&2
            exit 1
          fi
          ceiling=$(python scripts/unlisted_catalog.py ceiling)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ((i=0; i<SEGMENTS; i++)); do
            python scripts/unlisted_catalog.py scan \
              --count 100000 --ceiling "$ceiling" \
              --scanner tools/PicsScanner/bin/Release/net10.0/PicsScanner.dll
            git add state/steam/pics_scan.json state/steam/pics_dlcs.json
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint Steam product-info scan"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
            if python -c 'import json; exit(json.load(open("state/steam/pics_scan.json"))["next_app_id"] != 1)'; then
              break
            fi
          done

      - name: Publish Store-unlisted DLC
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          python scripts/unlisted_catalog.py publish \
            --scanner tools/PicsScanner/bin/Release/net10.0/PicsScanner.dll
          git add catalogs/steam/v1/unlisted-dlc.json manual/steam/extra-dlc.json
          if ! git diff --cached --quiet; then
            git commit -m "Update unlisted Steam DLC catalog"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
