name: Discover unlisted Steam DLC

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      segments:
        description: "0 scans only the newest IDs; 1-60 resumes the full pass for that many 100,000-ID segments (55 completes it)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: entitlements-catalog
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.segments > 0 && 350 || 90 }}
    env:
      SCANNER: tools/PicsScanner/bin/Release/net10.0/PicsScanner.dll
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build anonymous Steam product-info scanner
        run: |
          dotnet build tools/PicsScanner/PicsScanner.csproj -c Release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Discover DLC
        env:
          SEGMENTS: ${{ inputs.segments || '0' }}
        run: |
          if ! [[ "$SEGMENTS" =~ ^[0-9]+$ ]] || (( SEGMENTS > 60 )); then
            echo "segments must be 0..60" >&2
            exit 1
          fi
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              (( attempt < 3 )) || break
              echo "scan attempt $attempt failed; reconnecting in $((15 * attempt)) seconds" >&2
              sleep $((15 * attempt))
            done
            echo "scan failed after 3 attempts" >&2
            return 1
          }
          ceiling=$(python3 scripts/unlisted_catalog.py ceiling)
          if (( SEGMENTS == 0 )); then
            # New DLC IDs are allocated at the top of the range; older ranges rarely change.
            retry python3 scripts/unlisted_catalog.py scan --frontier \
              --count 200000 --ceiling "$ceiling" --scanner "$SCANNER"
            exit
          fi
          for ((i = 0; i < SEGMENTS; i++)); do
            retry python3 scripts/unlisted_catalog.py scan \
              --count 100000 --ceiling "$ceiling" --scanner "$SCANNER"
            git add state/steam
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint Steam product-info scan"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
            if jq -e '.next_app_id == 1' state/steam/pics_scan.json > /dev/null; then
              break
            fi
          done

      - name: Publish Store-unlisted DLC
        run: |
          python3 scripts/unlisted_catalog.py publish --scanner "$SCANNER"
          git add catalogs/steam state/steam
          if ! git diff --cached --quiet; then
            git commit -m "Update unlisted Steam DLC catalog"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
