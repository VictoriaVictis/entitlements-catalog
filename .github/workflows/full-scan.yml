name: Full scan

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: entitlements-catalog
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Cache state
        uses: actions/cache@v4
        with:
          path: state/steam
          key: steam-state-${{ github.run_id }}
          restore-keys: |
            steam-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full scan
        run: python scripts/update_catalog.py --storefront steam --mode full --concurrency 16
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: "catalogs/steam/v1/dlc.json state/steam/**"
          commit_message: "Full entitlements catalog scan"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
